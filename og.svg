<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f1a"/>
      <stop offset="1" stop-color="#080b12"/>
    </linearGradient>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22c55e"/>
      <stop offset="0.5" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="glow1" cx="15%" cy="0%" r="60%">
      <stop offset="0" stop-color="#22c55e" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#22c55e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="95%" cy="12%" r="55%">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow1)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <!-- subtle grid -->
  <g stroke="#94a3b8" stroke-opacity="0.06" stroke-width="1">
    <line x1="0" y1="157" x2="1200" y2="157"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="472" x2="1200" y2="472"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
  </g>

  <!-- brand mark -->
  <rect x="80" y="86" width="88" height="88" rx="22" fill="url(#grad)"/>
  <text x="124" y="147" font-family="Arial, sans-serif" font-size="42" font-weight="700" fill="#04120a" text-anchor="middle">SG</text>

  <!-- availability pill -->
  <rect x="80" y="452" width="470" height="52" rx="26" fill="#0f172a" stroke="#94a3b8" stroke-opacity="0.2"/>
  <circle cx="112" cy="478" r="7" fill="#22c55e"/>
  <text x="132" y="485" font-family="'Courier New', monospace" font-size="21" fill="#94a3b8">Available · Remote (India / Global)</text>

  <!-- name -->
  <text x="78" y="290" font-family="Arial, sans-serif" font-size="104" font-weight="800" fill="#f1f5f9" letter-spacing="-2">Sunil Gautam</text>

  <!-- role -->
  <text x="82" y="356" font-family="'Courier New', monospace" font-size="27" fill="url(#grad)">Solution Architect · Team Lead · Full Stack (MERN + AWS)</text>

  <!-- sub -->
  <text x="82" y="404" font-family="Arial, sans-serif" font-size="26" fill="#94a3b8">13+ years · Enterprise SaaS across Banking, Entertainment &amp; E-commerce</text>

  <!-- tech tags -->
  <text x="1120" y="575" font-family="'Courier New', monospace" font-size="21" fill="#64748b" text-anchor="end">React · Next.js · Node · TypeScript · AWS</text>
</svg>
